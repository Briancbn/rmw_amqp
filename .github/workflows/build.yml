name: Build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - develop/**

jobs:
  industrial_ci:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
        test_type: [gcc, clang]
        include:
          - {distro: jazzy, test_type: gcc-asan}
          - {distro: jazzy, test_type: gcc-tsan}
          - {distro: jazzy, test_type: gcc-coverage}
    env:
      ISOLATION: "shell"
      ROS_DISTRO: ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ros:${{ matrix.distro }}-ros-core
    steps:
      - uses: actions/checkout@v4
      # GCC
      - if: ${{ matrix.test_type == 'gcc' }}
        uses: 'ros-industrial/industrial_ci@master'

      # GCC with coverage
      - if: ${{ matrix.test_type == 'gcc-coverage' }}
        uses: 'ros-industrial/industrial_ci@master'
        env:
          TARGET_CMAKE_ARGS: "-DCMAKE_C_FLAGS='--coverage' -DCMAKE_CXX_FLAGS='--coverage'"
          AFTER_SCRIPT: "./coverage.sh ci"

      # GCC with address sanitizer
      - if: ${{ matrix.test_type == 'gcc-asan' }}
        uses: 'ros-industrial/industrial_ci@master'
        env:
          TARGET_CMAKE_ARGS: '-DCMAKE_C_FLAGS="-fsanitize=address -O1 -g -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=address -O1 -g -fno-omit-frame-pointer"'

      # GCC with thread sanitizer
      - if: ${{ matrix.test_type == 'gcc-tsan' }}
        uses: 'ros-industrial/industrial_ci@master'
        env:
          TARGET_CMAKE_ARGS: '-DCMAKE_C_FLAGS="-fsanitize=thread -O2 -g -fno-omit-frame-pointer" -DCMAKE_CXX_FLAGS="-fsanitize=thread -O2 -g -fno-omit-frame-pointer"'

      # Clang
      - if: ${{ matrix.test_type == 'clang' }}
        uses: 'ros-industrial/industrial_ci@master'
        env:
          ADDITIONAL_DEBS: clang lld
          CC: "clang"
          CXX: "clang++"

      # Upload Coverage report if configured
      - name: Install dependency for Codecov
        if: ${{ matrix.test_type == 'gcc-coverage' }}
        run: sudo apt install curl git -qq -y
      - name: Upload coverage reports to Codecov
        if: ${{ matrix.test_type == 'gcc-coverage' }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.info
          fail_ci_if_error: true
